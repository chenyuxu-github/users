<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户管理</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主菜单">
        <div class="brand">
          <span class="brand-mark">U</span>
          <span>用户系统</span>
        </div>

        <nav class="menu">
          <a class="menu-item active" href="/" aria-current="page">
            <span class="menu-icon" aria-hidden="true"></span>
            <span>用户管理</span>
          </a>
        </nav>
      </aside>

      <main class="shell">
        <section class="toolbar" aria-label="用户操作">
          <div>
            <p class="eyebrow">User Service</p>
            <h1>用户管理</h1>
          </div>
          <div class="toolbar-actions">
            <button class="primary-button compact" id="newBtn" type="button">新建用户</button>
            <button class="icon-button" id="refreshBtn" type="button" title="刷新列表" aria-label="刷新列表">
              ↻
            </button>
          </div>
        </section>

        <section class="layout" id="layout">
          <section class="panel table-panel" aria-label="用户列表">
            <div class="panel-head">
              <h2>用户列表</h2>
              <span class="count" id="userCount">0</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>姓名</th>
                    <th>邮箱</th>
                    <th>更新时间</th>
                    <th class="action-col">操作</th>
                  </tr>
                </thead>
                <tbody id="userRows"></tbody>
              </table>
            </div>

            <div class="empty-state hidden" id="emptyState">暂无用户</div>
          </section>
        </section>

        <div class="modal hidden" id="userModal" role="dialog" aria-modal="true" aria-labelledby="formTitle">
          <div class="modal-backdrop" data-close-modal></div>
          <form class="modal-card form-panel" id="userForm">
            <input id="userId" type="hidden">
            <div class="panel-head">
              <h2 id="formTitle">新建用户</h2>
              <button class="ghost-button" id="cancelBtn" type="button">取消</button>
            </div>

            <label>
              <span>姓名</span>
              <input id="nameInput" name="name" type="text" autocomplete="name" required>
            </label>

            <label>
              <span>邮箱</span>
              <input id="emailInput" name="email" type="email" autocomplete="email" required>
            </label>

            <button class="primary-button" type="submit" id="submitBtn">创建用户</button>
          </form>
        </div>

        <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
      </main>
    </div>

    <script src="/assets/app.js"></script>
  </body>
</html>
